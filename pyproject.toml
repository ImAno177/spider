[project]
name = "spider-solidity-cpg"
version = "0.3.0"
description = "Solidity project code property graph extractor and verifier"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["crytic-compile==0.3.11", "slither-analyzer==0.11.5", "solc-select==1.2.0"]
keywords = ["solidity", "cpg", "program-analysis", "smart-contracts", "slither"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Compilers",
  "Topic :: Software Development :: Quality Assurance",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[project.urls]
Homepage = "https://github.com/ImAno177/spider"
Repository = "https://github.com/ImAno177/spider"
Issues = "https://github.com/ImAno177/spider/issues"

[project.scripts]
spider = "spider.__main__:main"
spider-batch = "spider.batch:main"
spider-verify = "spider.verify:main"

[tool.setuptools.packages.find]
include = ["spider*"]
exclude = ["spider.__pycache__*"]

[tool.setuptools.exclude-package-data]
"*" = ["*.pyc", "__pycache__/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 180

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
