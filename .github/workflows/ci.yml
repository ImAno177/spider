name: CI

on:
  push:
    paths:
      - "spider/**"
  pull_request:
    paths:
      - "spider/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
      - name: Install Spider and development tools
        run: python -m pip install -e '.[dev]'
      - name: Install fixture compilers
        run: solc-select install 0.4.25 0.8.11 0.8.20
      - name: Test
        run: python -m pytest -q
      - name: Lint
        run: python -m ruff check .
      - name: Compile
        run: python -m compileall -q spider tests scripts
      - name: Check README schema badge
        if: github.event_name == 'pull_request'
        run: python scripts/sync_schema_badge.py --check
      - name: Build wheel
        run: python -m pip wheel . --no-deps --wheel-dir out/wheels

  sync-schema-badge:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Synchronize README schema badge
        run: python scripts/sync_schema_badge.py
      - name: Commit updated badge
        run: |
          if git diff --quiet -- README.md; then
            echo "README schema badge is current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: sync CPG schema badge"
          git push origin HEAD:${{ github.ref_name }}
