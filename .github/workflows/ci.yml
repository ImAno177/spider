name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
      - name: Install Spider and development tools
        run: python -m pip install -e '.[dev]'
      - name: Install fixture compilers
        run: solc-select install 0.4.25 0.8.11 0.8.20
      - name: Test
        run: python -m pytest -q
      - name: Lint
        run: python -m ruff check .
      - name: Compile
        run: python -m compileall -q spider tests scripts
      - name: Build wheel
        run: python -m pip wheel . --no-deps --wheel-dir out/wheels
